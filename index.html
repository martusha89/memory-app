<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1a1a24;--border:#2a2a3a;--text:#e4e4ef;--text2:#8888a0;--accent:#a78bfa;--accent2:#7c3aed;--red:#ef4444;--green:#22c55e;--orange:#f59e0b;--blue:#3b82f6;--radius:10px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;max-width:440px;width:100%}
.login-box h1{font-size:28px;margin-bottom:4px;background:linear-gradient(135deg,var(--accent),#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box .subtitle{font-size:14px;color:var(--text2);margin-bottom:28px}
.login-box label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;margin-top:16px}
.login-box input{width:100%;margin-bottom:4px}
.login-box .hint{font-size:12px;color:var(--text2)}
.btn{background:var(--accent2);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-full{width:100%;margin-top:24px;padding:12px}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:6px 14px}
.btn-ghost:hover{border-color:var(--accent);color:var(--text)}
.btn-danger{background:var(--red)}
.btn-danger:hover{opacity:.85}
.error-msg{color:var(--red);font-size:13px;margin-top:8px;display:none}

/* App Layout */
.app{display:none;height:100vh;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.topbar h1{font-size:18px;background:linear-gradient(135deg,var(--accent),#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:auto;white-space:nowrap}
.search-box{flex:1;max-width:500px;position:relative}
.search-box input{width:100%;padding-left:36px}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text2)}
.topbar .server-label{font-size:11px;color:var(--text2);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .disconnect{font-size:12px;color:var(--text2);cursor:pointer;padding:6px 10px;border:1px solid var(--border);border-radius:6px}
.topbar .disconnect:hover{border-color:var(--red);color:var(--red)}

.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:230px;border-right:1px solid var(--border);padding:16px;overflow-y:auto;flex-shrink:0;background:var(--surface)}
.sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:10px}
.cat-list{list-style:none;margin-bottom:24px}
.cat-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text2);transition:all .15s}
.cat-item:hover,.cat-item.active{background:var(--surface2);color:var(--text)}
.cat-item.active{border-left:3px solid var(--accent);padding-left:7px}
.cat-count{font-size:12px;background:var(--surface2);padding:2px 8px;border-radius:10px;min-width:28px;text-align:center}
.cat-item.active .cat-count{background:var(--accent2);color:#fff}
.stat-card{background:var(--surface2);border-radius:10px;padding:14px;margin-bottom:8px}
.stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2)}
.stat-card .value{font-size:22px;font-weight:700;margin-top:4px}
.sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text2)}
.sidebar-footer a{font-size:12px}

.content{flex:1;overflow-y:auto;padding:20px}
.content-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.content-header h2{font-size:16px;color:var(--text2)}
.sort-controls{display:flex;gap:6px}
.sort-btn{font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);color:var(--text2);cursor:pointer}
.sort-btn:hover,.sort-btn.active{border-color:var(--accent);color:var(--accent)}

.memory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.memory-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border .2s,transform .15s}
.memory-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.memory-card .mc-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.badge-cat{background:var(--accent2);color:#fff}
.badge-imp{background:var(--surface2);color:var(--orange)}
.badge-source{background:var(--surface2);color:var(--text2);font-size:10px}
.mc-content{font-size:14px;line-height:1.6;color:var(--text);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.mc-meta{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12px;color:var(--text2)}
.mc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;padding:2px 8px;background:var(--surface2);border-radius:4px;color:var(--text2);cursor:pointer}
.tag:hover{color:var(--accent)}
.mc-score{margin-left:auto;font-weight:600;color:var(--accent)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:20px}
.modal label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;margin-top:14px}
.modal input,.modal textarea,.modal select{width:100%}
.modal-actions{display:flex;gap:10px;margin-top:24px;justify-content:flex-end}
.imp-stars{display:flex;gap:4px;margin-top:6px}
.imp-star{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .15s}
.imp-star.active{background:var(--orange);border-color:var(--orange);color:#000}
.imp-star:hover{border-color:var(--orange)}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px;padding:16px 0}
.pagination button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:13px}
.pagination button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pagination button:disabled{opacity:.3;cursor:not-allowed}
.pagination .page-info{font-size:13px;color:var(--text2)}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty svg{width:48px;height:48px;margin-bottom:16px;opacity:.4}
.empty p{font-size:14px}

/* Loading */
.loading{text-align:center;padding:40px;color:var(--text2)}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:14px;z-index:200;transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}

/* Responsive */
@media(max-width:768px){
  .sidebar{display:none}
  .memory-grid{grid-template-columns:1fr}
  .topbar{flex-wrap:wrap}
  .search-box{order:3;max-width:100%;flex-basis:100%}
  .topbar .server-label{display:none}
}
</style>
</head>
<body>

<!-- Login Screen -->
<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <h1>Memory</h1>
    <p class="subtitle">Connect to any Memory server to browse, search, and manage memories.</p>
    <label>Server URL</label>
    <input type="url" id="serverUrl" placeholder="https://your-server.workers.dev">
    <div class="hint">The URL of the Memory server you want to connect to</div>
    <label>Secret</label>
    <input type="password" id="secretInput" placeholder="MEMORY_SECRET">
    <div class="hint">The server's authentication secret</div>
    <div class="error-msg" id="loginError"></div>
    <button class="btn btn-full" onclick="doLogin()">Connect</button>
  </div>
</div>

<!-- App -->
<div class="app" id="app">
  <div class="topbar">
    <h1>Memory</h1>
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search memories by meaning..." onkeydown="if(event.key==='Enter')doSearch()">
    </div>
    <button class="btn btn-sm" onclick="openNewModal()">+ New</button>
    <span class="server-label" id="serverLabel"></span>
    <button class="disconnect" onclick="doLogout()">Disconnect</button>
  </div>
  <div class="main">
    <div class="sidebar">
      <h3>Categories</h3>
      <ul class="cat-list" id="catList"></ul>
      <h3>Overview</h3>
      <div id="statsArea"></div>
      <div class="sidebar-footer">
        <a href="https://github.com/martusha89/Memory" target="_blank">Memory Server</a> &middot; v2.1
      </div>
    </div>
    <div class="content" id="contentArea">
      <div class="loading"><div class="spinner"></div>Loading memories...</div>
    </div>
  </div>
</div>

<!-- View/Edit Modal -->
<div class="modal-overlay" id="viewModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">Memory</h2>
    <label>Content</label>
    <textarea id="mContent" rows="5"></textarea>
    <label>Category</label>
    <select id="mCategory"></select>
    <label>Tags (comma-separated)</label>
    <input type="text" id="mTags" placeholder="tag1, tag2, tag3">
    <label>Importance</label>
    <div class="imp-stars" id="mImpStars"></div>
    <div class="mc-meta" id="mMeta" style="margin-top:16px"></div>
    <div class="modal-actions">
      <button class="btn btn-danger btn-sm" id="mDeleteBtn" onclick="doDelete()">Delete</button>
      <div style="flex:1"></div>
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-sm" id="mSaveBtn" onclick="doSave()">Save</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ────────────────────────────────────────────────────────────
let BASE = '';
let SECRET = '';
let CATEGORIES = [];
let ALL_MEMORIES = [];
let CURRENT_CAT = null;
let EDITING_ID = null;
let IMPORTANCE = 3;
let IS_SEARCH = false;
let CURRENT_SORT = 'created_at';
let CURRENT_ORDER = 'desc';
let TOTAL = 0;
let OFFSET = 0;
const LIMIT = 50;

// ── API ──────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const url = BASE + path;
  const headers = {
    'Authorization': 'Bearer ' + SECRET,
    'Content-Type': 'application/json',
    ...(opts.headers || {})
  };
  const r = await fetch(url, { ...opts, headers });
  if (r.status === 401) throw new Error('Invalid secret — check your credentials');
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.error || 'Request failed (' + r.status + ')');
  }
  return r.json();
}

// ── Auth ─────────────────────────────────────────────────────────────
async function doLogin() {
  const urlInput = document.getElementById('serverUrl');
  const secretInput = document.getElementById('secretInput');
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  const rawUrl = urlInput.value.trim().replace(/\/+$/, '');
  SECRET = secretInput.value.trim();

  if (!rawUrl) { errEl.textContent = 'Server URL is required'; errEl.style.display = 'block'; return; }
  if (!SECRET) { errEl.textContent = 'Secret is required'; errEl.style.display = 'block'; return; }

  BASE = rawUrl;

  try {
    const r = await api('/api/categories');
    CATEGORIES = r.categories;
    localStorage.setItem('memory_base', BASE);
    localStorage.setItem('memory_secret', SECRET);
    showApp();
  } catch (e) {
    // Try /health as fallback to check if it's a Memory server at all
    try {
      const health = await fetch(BASE + '/health');
      const data = await health.json();
      if (data.name === 'Memory' && !data.version?.startsWith('2.1')) {
        errEl.textContent = 'This server needs to be updated to v2.1+ for the web app. The REST API is required.';
      } else {
        errEl.textContent = e.message || 'Connection failed';
      }
    } catch {
      errEl.textContent = e.message || 'Could not reach server — check the URL';
    }
    errEl.style.display = 'block';
  }
}

function doLogout() {
  localStorage.removeItem('memory_base');
  localStorage.removeItem('memory_secret');
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  BASE = ''; SECRET = '';
}

// ── App ──────────────────────────────────────────────────────────────
async function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('serverLabel').textContent = BASE.replace(/^https?:\/\//, '');
  await Promise.all([loadMemories(), loadStats()]);
}

async function loadMemories(cat) {
  CURRENT_CAT = cat || null;
  IS_SEARCH = false;
  OFFSET = 0;
  await fetchPage();
}

async function fetchPage() {
  const params = new URLSearchParams({
    limit: LIMIT.toString(),
    offset: OFFSET.toString(),
    sort: CURRENT_SORT,
    order: CURRENT_ORDER
  });
  if (CURRENT_CAT) params.set('category', CURRENT_CAT);

  document.getElementById('contentArea').innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

  try {
    const data = await api('/api/memories?' + params);
    ALL_MEMORIES = data.memories;
    TOTAL = data.total;
    renderMemories(ALL_MEMORIES);
  } catch (e) {
    document.getElementById('contentArea').innerHTML = '<div class="empty"><p>Failed to load: ' + esc(e.message) + '</p></div>';
  }
  buildCategories();
}

async function loadStats() {
  try {
    const s = await api('/api/stats');
    const area = document.getElementById('statsArea');
    area.innerHTML =
      '<div class="stat-card"><div class="label">Total</div><div class="value">' + s.total_memories + '</div></div>' +
      '<div class="stat-card"><div class="label">Stale (90d)</div><div class="value">' + s.stale_memories + '</div></div>';
    if (!CATEGORIES.length) CATEGORIES = s.categories_configured;
    window._stats = s;
  } catch (e) { console.error('stats', e); }
}

// ── Categories ───────────────────────────────────────────────────────
function buildCategories() {
  const list = document.getElementById('catList');
  const totalCount = window._stats?.total_memories || TOTAL;
  let html = '<li class="cat-item' + (CURRENT_CAT === null ? ' active' : '') + '" onclick="loadMemories()">' +
    '<span>All</span><span class="cat-count">' + totalCount + '</span></li>';
  CATEGORIES.forEach(c => {
    const statCt = window._stats?.by_category?.find(x => x.category === c)?.count || 0;
    html += '<li class="cat-item' + (CURRENT_CAT === c ? ' active' : '') + '" onclick="loadMemories(\'' + c + '\')">' +
      '<span>' + c + '</span><span class="cat-count">' + statCt + '</span></li>';
  });
  list.innerHTML = html;
}

// ── Render ────────────────────────────────────────────────────────────
function renderMemories(memories) {
  const area = document.getElementById('contentArea');

  const title = IS_SEARCH
    ? 'Search Results (' + memories.length + ')'
    : CURRENT_CAT
      ? CURRENT_CAT + ' (' + TOTAL + ')'
      : 'All Memories (' + TOTAL + ')';

  const sortButtons = IS_SEARCH ? '' :
    '<div class="sort-controls">' +
    sortBtn('created_at', 'Newest') +
    sortBtn('importance', 'Important') +
    sortBtn('access_count', 'Most Recalled') +
    '</div>';

  const header = '<div class="content-header"><h2>' + title + '</h2>' + sortButtons + '</div>';

  if (!memories.length) {
    area.innerHTML = header + '<div class="empty"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z"/></svg><p>' + (IS_SEARCH ? 'No memories match your search.' : 'No memories yet.') + '</p></div>';
    return;
  }

  let cards = '';
  memories.forEach(m => {
    const stars = '\u2605'.repeat(m.importance) + '\u2606'.repeat(5 - m.importance);
    const tags = m.tags.map(t => '<span class="tag" onclick="event.stopPropagation();searchTag(\'' + esc(t) + '\')">' + esc(t) + '</span>').join('');
    const date = new Date(m.created_at + 'Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    const score = m.score != null ? '<span class="mc-score">' + Math.round(m.score * 100) + '%</span>' : '';
    cards += '<div class="memory-card" onclick="openView(' + m.id + ')">' +
      '<div class="mc-top">' +
        '<span class="badge badge-cat">' + esc(m.category) + '</span>' +
        '<span class="badge badge-imp">' + stars + '</span>' +
        '<span class="badge badge-source">' + esc(m.source) + '</span>' +
      '</div>' +
      '<div class="mc-content">' + esc(m.content) + '</div>' +
      (tags ? '<div class="mc-tags">' + tags + '</div>' : '') +
      '<div class="mc-meta"><span>' + date + '</span><span>' + m.access_count + ' recalls</span>' + score + '</div>' +
    '</div>';
  });

  // Pagination
  let pagination = '';
  if (!IS_SEARCH && TOTAL > LIMIT) {
    const page = Math.floor(OFFSET / LIMIT) + 1;
    const totalPages = Math.ceil(TOTAL / LIMIT);
    pagination = '<div class="pagination">' +
      '<button onclick="prevPage()"' + (OFFSET === 0 ? ' disabled' : '') + '>&larr; Previous</button>' +
      '<span class="page-info">Page ' + page + ' of ' + totalPages + '</span>' +
      '<button onclick="nextPage()"' + (OFFSET + LIMIT >= TOTAL ? ' disabled' : '') + '>Next &rarr;</button>' +
    '</div>';
  }

  area.innerHTML = header + '<div class="memory-grid">' + cards + '</div>' + pagination;
}

function sortBtn(field, label) {
  const active = CURRENT_SORT === field;
  return '<button class="sort-btn' + (active ? ' active' : '') + '" onclick="setSort(\'' + field + '\')">' + label + '</button>';
}

function setSort(field) {
  if (CURRENT_SORT === field) {
    CURRENT_ORDER = CURRENT_ORDER === 'desc' ? 'asc' : 'desc';
  } else {
    CURRENT_SORT = field;
    CURRENT_ORDER = 'desc';
  }
  OFFSET = 0;
  fetchPage();
}

function prevPage() { OFFSET = Math.max(0, OFFSET - LIMIT); fetchPage(); }
function nextPage() { OFFSET += LIMIT; fetchPage(); }

// ── Search ───────────────────────────────────────────────────────────
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { loadMemories(CURRENT_CAT); return; }
  IS_SEARCH = true;
  document.getElementById('contentArea').innerHTML = '<div class="loading"><div class="spinner"></div>Searching by meaning...</div>';
  try {
    const body = { query: q, limit: 20 };
    if (CURRENT_CAT) body.category = CURRENT_CAT;
    const results = await api('/api/recall', { method: 'POST', body: JSON.stringify(body) });
    ALL_MEMORIES = results;
    TOTAL = results.length;
    renderMemories(results);
  } catch (e) {
    document.getElementById('contentArea').innerHTML = '<div class="empty"><p>Search failed: ' + esc(e.message) + '</p></div>';
  }
}

function searchTag(tag) {
  document.getElementById('searchInput').value = tag;
  doSearch();
}

// ── Modal ────────────────────────────────────────────────────────────
function openView(id) {
  const m = ALL_MEMORIES.find(x => x.id === id);
  if (!m) return;
  EDITING_ID = id;
  IMPORTANCE = m.importance;
  document.getElementById('modalTitle').textContent = 'Memory #' + id;
  document.getElementById('mContent').value = m.content;
  buildCatSelect(m.category);
  document.getElementById('mTags').value = m.tags.join(', ');
  buildImpStars();
  const created = new Date(m.created_at + 'Z').toLocaleString();
  const updated = m.updated_at !== m.created_at ? ' &middot; Updated: ' + new Date(m.updated_at + 'Z').toLocaleString() : '';
  document.getElementById('mMeta').innerHTML =
    'Created: ' + created + updated +
    ' &middot; Source: ' + m.source +
    ' &middot; Recalled: ' + m.access_count + ' times';
  document.getElementById('mDeleteBtn').style.display = 'inline-block';
  document.getElementById('mSaveBtn').textContent = 'Save';
  document.getElementById('viewModal').classList.add('open');
}

function openNewModal() {
  EDITING_ID = null;
  IMPORTANCE = 3;
  document.getElementById('modalTitle').textContent = 'New Memory';
  document.getElementById('mContent').value = '';
  buildCatSelect('general');
  document.getElementById('mTags').value = '';
  buildImpStars();
  document.getElementById('mMeta').innerHTML = '';
  document.getElementById('mDeleteBtn').style.display = 'none';
  document.getElementById('mSaveBtn').textContent = 'Store';
  document.getElementById('viewModal').classList.add('open');
  setTimeout(() => document.getElementById('mContent').focus(), 100);
}

function closeModal() {
  document.getElementById('viewModal').classList.remove('open');
  EDITING_ID = null;
}

function buildCatSelect(sel) {
  const s = document.getElementById('mCategory');
  s.innerHTML = CATEGORIES.map(c =>
    '<option value="' + c + '"' + (c === sel ? ' selected' : '') + '>' + c + '</option>'
  ).join('');
}

function buildImpStars() {
  const wrap = document.getElementById('mImpStars');
  wrap.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const el = document.createElement('div');
    el.className = 'imp-star' + (i <= IMPORTANCE ? ' active' : '');
    el.textContent = i;
    el.onclick = () => { IMPORTANCE = i; buildImpStars(); };
    wrap.appendChild(el);
  }
}

// ── CRUD ─────────────────────────────────────────────────────────────
async function doSave() {
  const content = document.getElementById('mContent').value.trim();
  if (!content) { toast('Content is required', 'error'); return; }
  const category = document.getElementById('mCategory').value;
  const tags = document.getElementById('mTags').value.split(',').map(t => t.trim()).filter(Boolean);

  try {
    if (EDITING_ID) {
      await api('/api/memories/' + EDITING_ID, {
        method: 'PUT',
        body: JSON.stringify({ content, category, tags, importance: IMPORTANCE })
      });
      toast('Memory updated');
    } else {
      const result = await api('/api/memories', {
        method: 'POST',
        body: JSON.stringify({ content, category, tags, importance: IMPORTANCE, source: 'web' })
      });
      if (result.duplicate) {
        if (confirm('Similar memory exists (ID ' + result.existing_id + ', ' + result.similarity + '% similar):\n\n"' + result.existing_content + '"\n\nStore anyway?')) {
          await api('/api/memories', {
            method: 'POST',
            body: JSON.stringify({ content, category, tags, importance: IMPORTANCE, source: 'web', force: true })
          });
          toast('Memory stored');
        } else { return; }
      } else {
        toast('Memory stored');
      }
    }
    closeModal();
    await loadMemories(CURRENT_CAT);
    await loadStats();
  } catch (e) { toast(e.message, 'error'); }
}

async function doDelete() {
  if (!EDITING_ID || !confirm('Delete this memory permanently?')) return;
  try {
    await api('/api/memories/' + EDITING_ID, { method: 'DELETE' });
    toast('Memory deleted');
    closeModal();
    await loadMemories(CURRENT_CAT);
    await loadStats();
  } catch (e) { toast(e.message, 'error'); }
}

// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type + ' show';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'toast'; }, 3000);
}

// ── Keyboard shortcuts ───────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault();
    document.getElementById('searchInput')?.focus();
  }
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    if (!document.querySelector('.modal-overlay.open')) openNewModal();
  }
});

// ── URL params for shareable links ───────────────────────────────────
function getUrlParams() {
  const params = new URLSearchParams(window.location.search);
  return {
    server: params.get('server'),
    secret: params.get('secret')
  };
}

// ── Init ─────────────────────────────────────────────────────────────
(async () => {
  // Check URL params first (shareable links)
  const params = getUrlParams();
  if (params.server && params.secret) {
    BASE = params.server.replace(/\/+$/, '');
    SECRET = params.secret;
    try {
      const r = await api('/api/categories');
      CATEGORIES = r.categories;
      localStorage.setItem('memory_base', BASE);
      localStorage.setItem('memory_secret', SECRET);
      // Clean URL
      window.history.replaceState({}, '', window.location.pathname);
      showApp();
      return;
    } catch (e) { /* fall through to login */ }
  }

  // Check localStorage
  const b = localStorage.getItem('memory_base');
  const s = localStorage.getItem('memory_secret');
  if (b && s) {
    BASE = b;
    SECRET = s;
    try {
      const r = await api('/api/categories');
      CATEGORIES = r.categories;
      showApp();
      return;
    } catch (e) { /* credentials expired, show login */ }
  }

  // Pre-fill from localStorage if available
  if (b) document.getElementById('serverUrl').value = b;
  document.getElementById('loginScreen').style.display = 'flex';
})();
</script>
